name: Auto-Update GitHub Profile

on:
  schedule:
    - cron: "0 0 * * 1" # Runs every Monday
  workflow_dispatch: # Allows manual trigger

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Fetch Starred Repos
        run: |
          echo "### ⭐ Latest Starred Repositories" > starred.md
          curl -s "https://api.github.com/users/tijo-thomaz/starred" | jq -r '.[] | "- [" + .name + "](" + .html_url + ") - " + .description' >> starred.md

      - name: Update Profile README
        run: |
          cat README.md > temp_readme.md
          echo "" >> temp_readme.md
          cat starred.md >> temp_readme.md
          mv temp_readme.md README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add README.md
          git commit -m "Auto-update starred repositories" || echo "No changes to commit"
          git push
